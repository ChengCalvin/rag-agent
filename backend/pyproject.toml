[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novamart-agent"
version = "0.1.0"
description = "NovaMart RAG assistant prototype (Google ADK, Gemini)"
requires-python = ">=3.11"
dependencies = [
    "google-adk==2.15.0",  # pinned to the version verified live in tasks 1.3/1.4 (2026-11-24)
    "google-genai",
    "numpy",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "google-adk[eval]==2.15.0",
    "mypy",
    "pytest",
    "python-dotenv",  # owner-run eval scripts load backend/.env
    "ruff",
    "types-pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "evals"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "C90", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 4
max-statements = 50

[tool.mypy]
strict = true
files = ["src"]
